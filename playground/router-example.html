<!DOCTYPE html>
<html>
<head>
  <script src="../../dist/build/velin-all.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    nav { margin-bottom: 1rem; border-bottom: 1px solid #ccc; padding-bottom: 1rem; }
    .card { border: 1px solid #ddd; padding: 1rem; margin-top: 1rem; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="app">
    <nav>
      <button vln-on:click="myRoute.path = '/'">Home</button>
      <button vln-on:click="myRoute.path = '/profile/alice'">Alice</button>
      <button vln-on:click="myRoute.path = '/profile/bob'">Bob</button>
    </nav>

    <!-- Router Container -->
    <div vln-router="myRoute">
      
      <!-- Home Route -->
      <div vln-route="/">
        <h1>Home</h1>
        <p>Welcome to the Velin SPA example.</p>
      </div>

      <!-- Profile Route -->
      <div vln-route="/profile/:id" vln-var:id="$route.params.id">
        <div vln-fragment="'profile-template'" vln-var:id="id"></div>
      </div>

    </div>
  </div>

  <template id="profile-template" vln-vars="id">
    <div class="card" 
         vln-on:init="console.log('Profile mounted for:', id)"
         vln-on:destroy="console.log('Profile unmounted')">
      <h1>Profile</h1>
      <p>User ID: <span vln-text="id"></span></p>
      <p vln-watch:logChange="id">Watching ID changes...</p>
    </div>
  </template>

  <script>
    const state = {
      myRoute: { path: window.location.pathname, params: {}, query: {}, error: null, loading: false },
      logChange(id) {
        console.log('User ID changed to:', id);
      }
    };

    // Tiny helper to parse params for this example
    // In a real app, the router plugin would handle this automatically based on pattern
    const parseParams = (path) => {
        const parts = path.split('/');
        if (parts[1] === 'profile') return { id: parts[2] || 'unknown' };
        return {};
    };

    // Watch path to update params manually for this example
    const vln = Velin.bind(document.getElementById('app'), state);

    // Watch path and update params
    Velin.plugins.registerPlugin({
        name: 'watch-path',
        track: () => state.myRoute.path,
        render: () => {
            state.myRoute.params = parseParams(state.myRoute.path);
        }
    });
  </script>
</body>
</html>
